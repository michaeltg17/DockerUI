services:
  docker-ui:
    image: docker-ui-local:latest
    container_name: docker-ui-e2e-readonly-settings
    ports:
      - "5014:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./appsettings.json:/app/appsettings.json:ro
    # The non-root dashboard reaches the socket through group access; ci.sh
    # exports the socket's gid (0/root covers Docker Desktop's root:root).
    group_add:
      - "${SOCKET_GROUP_GID:-0}"
