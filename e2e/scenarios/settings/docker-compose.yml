services:
  docker-ui:
    image: docker-ui-local:latest
    container_name: docker-ui-e2e-settings
    ports:
      - "5011:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Read-write (unlike the socket and the readonly-settings scenario): the
      # scenario's tests save settings, which rewrites the file in place.
      - ./appsettings.json:/app/appsettings.json
    # The non-root dashboard reaches the socket through group access; ci.sh
    # exports the socket's gid (0/root covers Docker Desktop's root:root).
    group_add:
      - "${SOCKET_GROUP_GID:-0}"
