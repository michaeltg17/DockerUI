services:
  docker-ui:
    # Image published to GHCR by CI on every push to main.
    # To build from source instead:
    #   docker build -t docker-ui:latest .
    #   then set image: docker-ui:latest
    image: ghcr.io/michaeltg17/docker-ui:latest
    container_name: docker-ui
    ports:
      - "5000:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Optional: all settings live in a single appsettings.json. Copy
      # appsettings.example.json next to this file as appsettings.json, edit
      # it, and uncomment this line (the file replaces the packaged defaults,
      # so it must keep 'DockerUI:DockerSocketPath'; shortcut edits are
      # persisted into it, so keep the mount read-write).
      # - ./appsettings.json:/app/appsettings.json
    restart: unless-stopped
