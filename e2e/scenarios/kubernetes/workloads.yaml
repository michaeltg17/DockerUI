# Demo workloads for the e2e kubernetes scenario, covering the runtime's real paths:
# a scalable deployment with a NodePort service (card url), a stateful set (its scale
# path), a daemon set (the stop-marker path), problem-state deployments (unpullable
# image, crash-looping container) and a standalone pod (snapshot, delete and recreate). Applied by the fixture with
# kubectl; the dashboard watches every namespace except the kube-system ones.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: k8s-web
  template:
    metadata:
      labels:
        app: k8s-web
    spec:
      containers:
        - name: app
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-web
spec:
  type: NodePort
  selector:
    app: k8s-web
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: k8s-store
spec:
  serviceName: k8s-store
  replicas: 1
  selector:
    matchLabels:
      app: k8s-store
  template:
    metadata:
      labels:
        app: k8s-store
    spec:
      containers:
        - name: app
          image: nginx:1.27-alpine
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: k8s-agent
spec:
  selector:
    matchLabels:
      app: k8s-agent
  template:
    metadata:
      labels:
        app: k8s-agent
    spec:
      containers:
        - name: agent
          image: busybox:1.36
          command: ["sleep", "3600"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-broken
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-broken
  template:
    metadata:
      labels:
        app: k8s-broken
    spec:
      containers:
        - name: app
          image: no-such-image.invalid/k8s-broken:v1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-crash
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-crash
  template:
    metadata:
      labels:
        app: k8s-crash
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "exit 3"]
---
apiVersion: v1
kind: Pod
metadata:
  name: k8s-standalone
spec:
  containers:
    - name: app
      image: nginx:1.27-alpine
