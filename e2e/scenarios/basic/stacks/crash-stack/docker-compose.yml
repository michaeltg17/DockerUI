services:
  crashed:
    image: busybox:1.36
    command: ["sh", "-c", "exit 7"]
  looping:
    image: busybox:1.36
    restart: always
    command: ["sh", "-c", "exit 5"]
  sick:
    image: busybox:1.36
    command: ["sleep", "3600"]
    healthcheck:
      test: ["CMD", "sh", "-c", "exit 1"]
      interval: 5s
      timeout: 3s
      retries: 2
