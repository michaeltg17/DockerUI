services:
  docker-ui:
    image: docker-ui-e2e:latest
    container_name: docker-ui-e2e-error
    ports:
      - "5012:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # appsettings stays read-write: with fail-fast boot a read-only mount is
      # a boot error (that case has its own readonly-settings scenario).
      - ./appsettings.json:/app/appsettings.json
    # The non-root dashboard reaches the socket through group access; ci.sh
    # exports the socket's gid (0/root covers Docker Desktop's root:root).
    group_add:
      - "${SOCKET_GROUP_GID:-0}"
