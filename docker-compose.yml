services:
  docker-ui:
    # Image published to GHCR by CI on every push to main.
    # To build from source instead:
    #   docker build -t docker-ui:latest .
    #   then set image: docker-ui:latest
    image: ghcr.io/michaeltg17/docker-ui:latest
    container_name: docker-ui
    ports:
      - "5000:8080"
    environment:
      DockerUi__DockerSocketPath: /var/run/docker.sock
      DockerUi__PollIntervalSeconds: "5"
      # Optional: single JSON settings file (baseUrl, icon mappings, per-app
      # url/icon/hidden, app order). See README, "Settings file".
      # The file may not exist; defaults are used.
      DockerUi__SettingsFile: /app/config/settings.json
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Optional local config (settings.json). Created if missing.
      - ./config:/app/config:ro
    restart: unless-stopped
