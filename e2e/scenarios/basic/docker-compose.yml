services:
  docker-ui:
    image: docker-ui-e2e:latest
    container_name: docker-ui-e2e-basic
    ports:
      - "5010:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Read-write: shortcut edits are persisted into this file.
      - ./appsettings.json:/app/appsettings.json
